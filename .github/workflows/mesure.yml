# Mesure provisoire : GitHub réveille-t-il bien les tâches à l'heure ? (30 réveils puis plus rien)
name: Mesure ponctualité
on:
  schedule:
    - cron: "2-59/5 * * * *"
permissions:
  contents: write
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 verif/tick.py
      - run: |
          git config user.name "Nostradamus (robot)"
          git config user.email "actions@users.noreply.github.com"
          git add verif/ticks.json
          git commit -q -m "Mesure ponctualité" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
