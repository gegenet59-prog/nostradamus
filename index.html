<style>
:root{--bg:#0B0F17;--card:#131A26;--cell:#0E1420;--line:#1F2937;--txt:#E8ECF4;--soft:#C3CCDB;--mute:#9AA7BC;
--vert:#34D399;--orange:#FBBF24;--rouge:#F87171;--violet:#C084FC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#app{max-width:520px;margin:0 auto;padding:24px 16px 0;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:700 24px 'Space Grotesk',sans-serif;letter-spacing:-.5px}
.sub{font-size:12px;color:var(--mute);margin-top:2px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.chip{font-size:13px;font-weight:600;color:var(--soft);background:var(--card);border-radius:999px;padding:0 14px;min-height:44px;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--txt);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;gap:14px;align-items:center}
.ring{width:76px;height:76px;border-radius:50%;border:6px solid var(--mute);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--cell);font:700 17px 'Space Grotesk',sans-serif;gap:3px}
.meta{font-size:12px;color:var(--mute);font-weight:500}
.teams{font:700 20px 'Space Grotesk',sans-serif;letter-spacing:-.3px;line-height:1.15}
.lvl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.cells{display:flex;gap:8px}
.cell{flex:1;min-width:0;background:var(--cell);border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;gap:6px}
.cell .k{font-size:11px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .p{display:flex;align-items:center;gap:5px;font:700 16px 'Space Grotesk',sans-serif}
.cell .o{font-size:11px;color:var(--mute);font-weight:500;white-space:nowrap}
.cell .o b{color:var(--txt);font-weight:700}
.bar{height:4px;border-radius:2px;background:var(--line)}
.bar i{display:block;height:4px;border-radius:2px}
.phrase{font-size:13px;color:var(--soft);line-height:1.4}
.phrase b{color:var(--txt);font-weight:600}
.flag{align-self:flex-start;font-size:11px;font-weight:600;color:var(--orange);border:1px solid var(--orange);border-radius:6px;padding:2px 6px}
.tag{align-self:flex-start;font-size:11px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.wait{background:var(--cell);border-radius:12px;padding:12px;font-size:13px;color:var(--soft);line-height:1.45}
.score{font:700 18px 'Space Grotesk',sans-serif;color:var(--txt)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:14px;color:var(--soft);line-height:1.5}
.sante{background:rgba(248,113,113,.12);border:1px solid var(--rouge);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--soft);line-height:1.45}
.sante b{color:var(--txt);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--mute)}
nav button i{width:22px;height:3px;border-radius:2px;background:transparent}
nav button.on{color:var(--txt)}nav button.on i{background:var(--txt)}
.days button{min-height:44px;min-width:44px;background:var(--card);border-radius:12px;font-size:18px;color:var(--txt)}
.days{display:flex;align-items:center;justify-content:space-between;gap:8px}
.days span{font:700 15px 'Space Grotesk',sans-serif;text-align:center;flex:1}
.clic{cursor:pointer}
.clic::after{content:"Détail ›";align-self:flex-end;font-size:12px;font-weight:600;color:var(--mute)}
.back{align-self:flex-start;min-height:44px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--txt)}
.graph{width:100%;height:auto;display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--soft)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:16px;height:3px;border-radius:2px;display:inline-block}
.rel{width:100%;border-collapse:collapse;font-size:13px}
.rel th{font-size:11px;color:var(--mute);font-weight:600;text-align:left;padding:4px 0}
.rel td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.rel td small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.rel td b{font:700 15px 'Space Grotesk',sans-serif}
.blk{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:0 14px}
.blk>summary{list-style:none;min-height:56px;display:flex;align-items:center;justify-content:space-between;font:700 17px 'Space Grotesk',sans-serif;cursor:pointer}
.blk>summary::-webkit-details-marker{display:none}
.blk>summary::after{content:"›";font-size:22px;color:var(--mute);transform:rotate(90deg);transition:transform .15s}
.blk[open]>summary::after{transform:rotate(-90deg)}
.blk .in{display:flex;flex-direction:column;gap:12px;padding-bottom:14px}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fb button{min-height:64px;border-radius:14px;background:var(--cell);border:2px solid var(--c);text-align:left;padding:8px 12px;display:flex;flex-direction:column;gap:2px;font:700 16px 'Space Grotesk',sans-serif;color:var(--c)}
.fb button small{font:500 11px Inter,sans-serif;color:var(--mute)}
.fb button.on{background:var(--c);color:#0B0F17}.fb button.on small{color:#0B0F17}
.fs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sais{border:1px solid var(--line);border-radius:12px;background:var(--cell)}
.sais summary{min-height:44px;display:flex;align-items:center;padding:0 12px;font-size:14px;color:var(--txt);cursor:pointer}
.sais .ch{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px}
.sais .ch button{min-height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);font:600 13px Inter,sans-serif}
.sais .ch button.on{background:var(--txt);color:#0B0F17;border-color:var(--txt)}
.sais .ch button.act{border-style:dashed;color:var(--txt)}
.fs label{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mute);font-weight:600}
.fs select{width:100%;min-width:0;min-height:44px;border-radius:12px;background:var(--cell);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:14px;padding:0 10px}
.res{background:var(--cell);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.big{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.big div{display:flex;flex-direction:column;gap:3px}
.big b{font:700 22px 'Space Grotesk',sans-serif}
.big span{font-size:11px;color:var(--mute);font-weight:600}
.ecart{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.ecart b{font:700 24px 'Space Grotesk',sans-serif}
</style>
</head>

async function get(u){const r=await fetch(u+"?t="+Date.now());if(!r.ok)throw new Error(u+" "+r.status);return r.json()}

function dernierCotes(m,bk){const r=m.releves||{};for(const n of["H45","H3","H12"]){const c=r[n]&&r[n][bk];if(c)return c}return null}

function probas(c){const t=["1","N","2"].reduce((a,k)=>a+1/c[k],0);return Object.fromEntries(["1","N","2"].map(k=>[k,100/c[k]/t]))}
function valide(c){return c&&["1","N","2"].every(k=>c[k]>1)}
function lecture(m){
  const c=[dernierCotes(m,"pinnacle"),dernierCotes(m,"winamax")].find(valide);
  if(!c)return null;
  const p=probas(c), noms={"1":m.domicile,"N":"Nul","2":m.exterieur};
  const ord=["1","N","2"].sort((a,b)=>p[b]-p[a]);
  const [a,b]=ord, r=x=>Math.round(x);
  let t;
  if(a!=="N"&&p[a]>=50)t=`${noms[a]} favori (${r(p[a])} %)`;
  else if(a!=="N"&&p[a]-p[b]>=8)t=`${noms[a]} légèrement favori (${r(p[a])} %)`;
  else if(a==="N")t=`match très fermé, le nul est le plus probable (${r(p.N)} %)`;
  else t=`match équilibré : ${noms[a]} ${r(p[a])} %, ${noms[b]} ${r(p[b])} %`;
  return {p,t,c}
}
function carte(m){
  const f=m.feux, r=m.releves||{}, ent=`<span class="meta">${esc(COMP[m.competition]||m.competition)} · ${heure(m.coup_envoi)}${statut(m)?" · "+statut(m):""}</span>`;
  const nom=`<div class="teams">${esc(m.domicile)} – ${esc(m.exterieur)}</div>`;
  const sc=m.score?`<span class="score">${m.score.domicile} – ${m.score.exterieur}</span>`:"";
  if(!f){
    const h12=r.H12||{}, L=lecture(m);
    let txt="Le premier relevé des cotes (H-12) est prévu à "+(h12.prevu?heure(h12.prevu):"–")+".";
    if(h12.etat==="fait")txt="Premier relevé fait : les variations apparaissent dès le relevé suivant.";
    if(h12.etat==="vide")txt="Pas de cote Pinnacle disponible pour ce match.";
    const h3=r.H3||{};
    if(h12.etat==="manque")txt=L?"H-12 manqué : cotes affichées, sans variation pour ce match.":"H-12 manqué : pas de variation pour ce match. Les cotes arrivent au relevé H-3"+(h3.prevu?" (prévu à "+heure(h3.prevu)+")":"")+".";
    if(!L)return `<div class="card"><div class="top"><div class="ring" style="border-color:var(--line)">…</div><div>${ent}${nom}<div class="lvl" style="color:var(--mute)"><span class="dot"></span>En attente</div></div></div><div class="wait">${txt}</div>${sc}</div>`;
    const w=dernierCotes(m,"winamax")||{}, noms={"1":m.domicile,"N":"Nul","2":m.exterieur};
    const cl=["1","N","2"].map(k=>`<div class="cell"><span class="k">${k} · ${esc(noms[k])}</span>
<span class="p">${fr(L.c[k])}</span><span class="o">${Math.round(L.p[k])} % de chances</span>
${w[k]?`<span class="o">Winamax <b>${fr(w[k])}</b></span>`:""}</div>`).join("");
    return `<div class="card"><div>${ent}${nom}<div class="lvl" style="color:var(--mute)"><span class="dot"></span>Pas de variation</div></div>
<div class="cells">${cl}</div><div class="phrase">Les cotes donnent : <b>${esc(L.t)}</b></div><div class="wait">${txt}</div>${sc}</div>`;
  }
  const is=["1","N","2"].map(k=>[k,f.issues[k]]);
  const top=is.reduce((a,b)=>Math.abs(b[1].pct)>Math.abs(a[1].pct)?b:a);
  const niv=is.reduce((a,b)=>NIV[b[1].feu][2]>NIV[a[1].feu][2]?b:a)[1].feu;
  const col=NIV[niv][1];
  const p0=(r[f.partielle?"H3":"H12"]||{}).pinnacle||{}, p1=dernierCotes(m,"pinnacle")||{}, w1=dernierCotes(m,"winamax")||{};
  const noms={"1":m.domicile,"N":"Nul","2":m.exterieur};
  const cells=is.map(([k,i])=>{
    const c=NIV[i.feu][1], w=Math.min(100,Math.abs(i.pct)/18*100);
    const sgn=i.pct>0?"+":i.pct<0?"−":"";
    return `<div class="cell"><span class="k">${k} · ${esc(noms[k])}</span>
<span class="p" style="color:${c}">${fleche(i.fleche,c)}${sgn}${fr(Math.abs(i.pct),1)} %</span>
<span class="o">${fr(p0[k])} → <b>${fr(p1[k])}</b></span>
${w1[k]?`<span class="o">Winamax <b>${fr(w1[k])}</b></span>`:""}
<div class="bar"><i style="width:${w.toFixed(0)}%;background:${c}"></i></div></div>`}).join("");
  const ph=(m.marche&&m.marche.phrase)||"";
  const [pre,...rest]=ph.split(" : ");
  return `<div class="card"><div class="top">
<div class="ring" style="border-color:${col}">${fleche(top[1].fleche,col)}${fr(Math.abs(top[1].pct),1)}%</div>
<div style="min-width:0">${ent}${nom}<div class="lvl" style="color:${col}"><span class="dot" style="background:${col}"></span>${NIV[niv][0]}${f.provisoire?' · provisoire':''}${f.partielle?' · partielle (H-3 → H-45)':''}</div></div></div>
<div class="cells">${cells}</div>
${ph?`<div class="phrase">${esc(pre)} : <b>${esc(rest.join(" : "))}</b></div>`:""}
${(()=>{const L=lecture(m);return L?`<div class="phrase">Les cotes donnent : <b>${esc(L.t)}</b></div>`:""})()}
${m.marche&&m.marche.incoherent?'<span class="flag">Mouvement incohérent</span>':""}${sc}</div>`;
}


/* ---------- Écran d'un match ---------- */
const COUL={"1":"#6CB4FF","N":"#B8BFCC","2":"#F0A5E0"};
const RELS=[["H12","H-12"],["H3","H-3"],["H45","H-45"]];
function graphique(m){
  const R=m.releves||{}, W=340, H=236, X=[58,170,282], haut=30, bas=H-48;
  const val=(n,bk,k)=>{const c=(R[n]||{})[bk];return c&&c[k]>1?c[k]:null};
  const tous=[];
  for(const [n] of RELS)for(const bk of["pinnacle","winamax"])for(const k of["1","N","2"]){const v=val(n,bk,k);if(v)tous.push(v)}
  if(!tous.length)return "";
  let lo=Math.min(...tous), hi=Math.max(...tous); const pad=Math.max(.15,(hi-lo)*.14); lo-=pad; hi+=pad;
  const Y=v=>bas-(v-lo)/(hi-lo)*(bas-haut);
  let svg="", lab=[[],[],[]];
  for(const bk of["winamax","pinnacle"]){
    for(const k of["1","N","2"]){
      const p=RELS.map(([n],i)=>[i,val(n,bk,k)]).filter(x=>x[1]);
      if(!p.length)continue;
      const plein=bk==="pinnacle";
      if(p.length>1)svg+=`<polyline points="${p.map(([i,v])=>X[i]+","+Y(v).toFixed(1)).join(" ")}" fill="none" stroke="${COUL[k]}" stroke-width="${plein?2.6:1.6}" ${plein?"":'stroke-dasharray="4 4" opacity=".75"'} stroke-linejoin="round" stroke-linecap="round"/>`;
      for(const [i,v] of p){
        svg+=`<circle cx="${X[i]}" cy="${Y(v).toFixed(1)}" r="${plein?4.5:3}" fill="${plein?COUL[k]:"var(--card)"}" stroke="${COUL[k]}" stroke-width="${plein?0:1.5}"/>`;
        if(plein)lab[i].push({k,v,y:Y(v)-9});
      }
    }
  }
  for(let i=0;i<3;i++){
    lab[i].sort((a,b)=>a.y-b.y);
    const L=lab[i];
    for(let j=0;j<L.length;j++){
      const proche=j>0&&L[j].y-L[j-1].y<20;
      if(proche){const d=L[j-1].dessous?-1:1; L[j].dessous=!L[j-1].dessous; L[j].y=L[j].dessous?L[j].y+27:L[j].y}
    }
    for(const l of L)svg+=`<text x="${X[i]}" y="${l.y.toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="${COUL[l.k]}" stroke="var(--card)" stroke-width="3" paint-order="stroke">${fr(l.v)}</text>`;
  }
  RELS.forEach(([n,t],i)=>{
    const r=R[n]||{}, h=r.etat==="fait"&&r.fait_a?heure(r.fait_a):(r.etat==="manque"||r.etat==="vide")?"manqué":r.prevu?"prévu "+heure(r.prevu):"";
    svg+=`<text x="${X[i]}" y="${H-24}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--txt)">${t}</text><text x="${X[i]}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--mute)">${h}</text>`;
  });
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution des cotes aux relevés H-12, H-3 et H-45">${svg}</svg>`;
}
function tableauReleves(m){
  const R=m.releves||{}, ligne=([n,t])=>{
    const r=R[n]||{}, p=r.pinnacle, w=r.winamax;
    if(!p)return `<tr><td>${t}<small>${r.etat==="attente"?"à venir":"pas de relevé"}</small></td><td colspan="3" style="color:var(--mute)">–</td></tr>`;
    return `<tr><td>${t}<small>${r.fait_a?heure(r.fait_a):""}</small></td>${["1","N","2"].map(k=>`<td><b>${fr(p[k])}</b>${w&&w[k]?`<small>Winamax ${fr(w[k])}</small>`:""}</td>`).join("")}</tr>`;
  };
  return `<table class="rel"><tr><th>Relevé</th><th>1 · Dom.</th><th>N · Nul</th><th>2 · Ext.</th></tr>${RELS.map(ligne).join("")}</table>`;
}

${carte(m)}

<div class="card"><div class="teams" style="font-size:16px">Détail des relevés</div>${tableauReleves(m)}</div>`;
  $("#retour").onclick=()=>history.length>1?history.back():(location.hash="");

const VIDE=()=>({feu:null,sens:"",comp:"",issue:"",pari:"",saison:null,tranche:""});
const BL={hist:{url:"data/stats/historique.json",ST:null,etat:"",sel:VIDE(),nom:"Historique"},
          base:{url:"data/stats/base.json",ST:null,etat:"",sel:VIDE(),nom:"Ma base"}};
let ouvert={hist:true};
const PARI_TXT={aucun:"Pas de mouvement net","1":"1 · victoire domicile","N":"N · nul","2":"2 · victoire extérieur","1N":"1N","N2":"N2","12":"12"};
const SENS_TXT={baisse:"Baisse",hausse:"Hausse",stable:"Stable"};
const saisonTxt=s=>"20"+s.slice(0,2)+"-"+s.slice(2);
const nb=x=>Math.round(x).toLocaleString("fr-FR");
const pts=(x,d=1)=>{const r=Math.round(Math.abs(x)*10**d)/10**d;return (r===0?"":x>0?"+":"−")+fr(r,d)};
function agreger(B,sansFeu,feuForce){
  const sel=B.sel, idx=["comp","saison","issue","feu","sens","tranche","pari"].map(k=>[k,k==="feu"&&feuForce!==undefined?feuForce:sel[k]]);
  let n=0,s=0,pd=0,pa=0;
  for(const l of B.ST.lignes){
    let ok=true;
    for(let k=0;k<7;k++){const [nom,v]=idx[k];if(nom==="feu"&&sansFeu)continue;
      if(nom==="saison"){if(v!==null&&!v.includes(l[1])){ok=false;break}continue}const w=nom==="feu"?v:(v===""?null:Number(v));if(w!==null&&l[k]!==w){ok=false;break}}
    if(ok){n+=l[7];s+=l[8];pd+=l[9];pa+=l[10]}
  }
  return {n,s,pd,pa};
}
function majStats(c){
  const B=BL[c], D=B.ST.dimensions, f=B.sel.feu, rac="#b-"+c+" ";
  document.querySelectorAll(rac+".fb button").forEach(b=>{
    const k=Number(b.dataset.f);b.classList.toggle("on",f===k);
    b.querySelector("small").textContent=NIV[D.feu[k]][0]+" · "+nb(agreger(B,false,k).n)+" cas";
  });
  const ns=B.sel.saison, tot=D.saison.length;
  document.querySelectorAll(rac+".ch button[data-i]").forEach(b=>b.classList.toggle("on",ns===null||ns.includes(Number(b.dataset.i))));
  document.querySelector(rac+".sais summary").textContent="Saisons : "+(ns===null||ns.length===tot?"toutes ("+tot+")":ns.length===0?"aucune":ns.length===1?saisonTxt(D.saison[ns[0]]):ns.length+" sur "+tot);
  const r=agreger(B,false), el=document.querySelector(rac+".res");
  if(!r.n){el.innerHTML='<div class="phrase">Aucun cas pour cette sélection.</div>';return}
  const p=r.s/r.n, sor=100*p, dep=100*r.pd/r.n, arr=100*r.pa/r.n;
  // Intervalle de Wilson à 95 % : il reste valable sur de petits échantillons et pour des taux proches de
  // 0 ou 100 %, là où « ± 1,96 × écart-type » donne une marge nulle et fait passer du bruit pour un résultat.
  const wilson=(s,n,z=1.96)=>{const q=s/n,d=1+z*z/n,c=(q+z*z/(2*n))/d,
    m=z*Math.sqrt(q*(1-q)/n+z*z/(4*n*n))/d;return [Math.max(0,(c-m)*100),Math.min(100,(c+m)*100)]};
  const [bas,haut]=wilson(r.s,r.n);
  const tropPeu=r.n<30, horsIntervalle=bas>dep||haut<dep;
  const verdict=tropPeu?"Échantillon trop petit : aucun verdict possible"
    :horsIntervalle?`Signal : l'intervalle à 95 % exclut la probabilité promise par la cote (${bas>dep?"au-dessus":"en dessous"})`
    :"Rien de démontré : l'intervalle à 95 % contient la probabilité promise par la cote";
  const titre=f===null?"Toutes les couleurs":NIV[D.feu[f]][0]+" ("+["Vert","Orange","Rouge","Violet"][f]+")";
  el.innerHTML=`<div class="meta">${titre}</div>
<div class="big"><div><b>${nb(r.n)}</b><span>cas</span></div><div><b>${pc(sor)}</b><span>sortis</span></div><div><b>${pc(dep)}</b><span>promis par la cote de départ</span></div></div>
<div class="ecart"><span class="meta">Écart (sorti − promis)</span><b>${pts(sor-dep)} pts</b></div>
<div class="ecart"><span class="meta">Intervalle à 95 % du taux sorti</span><b>${pc(bas)} – ${pc(haut)}</b></div>
<div class="ecart"><span class="meta">Écart vs cote d'arrivée (${pc(arr)})</span><b>${pts(sor-arr)} pts</b></div>
<div class="meta">${verdict}</div>
${tropPeu?'<span class="flag">Moins de 30 cas : ne tire aucune conclusion</span>':""}`;
}

function ecranAlertes(){
  if(!SANTE)chargerSante();

  const rel=iso=>{if(!iso)return"?";const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
    return m<0?"à l'instant":m<1?"à l'instant":m<60?`il y a ${m} min`:m<2880?`il y a ${Math.round(m/60)} h`:`il y a ${Math.round(m/1440)} j`};
  const carte=(couleur,titre,lignes)=>{const l=lignes.filter(Boolean);

  const reveil=r.muet
    ?carte("var(--rouge)","Réveil automatique : muet",
      [r.dernier?`Dernier réveil reçu ${rel(r.dernier)}.`:"Aucun réveil reçu depuis la mise en place de la surveillance.",
       "Le collecteur ne tourne qu'au rythme lent de GitHub : les relevés H-45 sont pris en retard.",
       "À vérifier : le Cron Trigger du Worker Cloudflare."])
    :carte("var(--vert)","Réveil automatique : actif",
      [r.dernier?`Dernier réveil reçu ${rel(r.dernier)}.`:"Surveillance en cours de démarrage."]);
  const credits=(e.odds&&e.odds.reste!=null)
    ?carte("var(--soft)","Crédits The Odds API",[`${nb(e.odds.reste)} crédits restants · mode « ${esc(e.odds.mode||"?")} »`,
        e.odds.maj?`Dernier relevé de cotes ${rel(e.odds.maj)}.`:""]):"";
  const foot=(e.foot&&(e.foot.reste!=null||e.foot.suspendu))
    ?carte(e.foot.suspendu?"var(--rouge)":"var(--soft)","API-Football",[
        e.foot.suspendu?"Compte suspendu : aucun score, compo ni absent ne rentre. À réactiver sur dashboard.api-football.com.":"",
        e.foot.reste!=null?`${nb(e.foot.reste)} requêtes restantes aujourd'hui.`:""]):"";
  const liste=al.length
    ?`<div class="card"><div class="teams" style="font-size:15px">Dernières alertes</div>${al.slice(0,12)
        .map(a=>`<div class="meta"><b>${rel(a.quand)}</b> · ${esc(a.texte)}</div>`).join("")}</div>`
    :`<div class="msg">Aucune alerte enregistrée. C'est bon signe.</div>`;
  app.innerHTML=`<div><h1>Alertes</h1><div class="sub">Santé du collecteur et pannes récentes</div></div>${reveil}${credits}${foot}${liste}
<div class="meta">Les notifications sur téléphone arriveront plus tard.</div>`;
}
const pc=(x,d=1)=>fr(x,d)+" %";

function dessiner(){
  if(onglet==="stats"){ecranStats();return}
  const mid=(location.hash.match(/^#m\/(.+)$/)||[])[1], mm=onglet==="matchs"&&mid?matchs.find(x=>x.id===mid):null;
  if(mm){ecranMatch(mm);return}
  if(onglet!=="matchs"){ecranAlertes();return}
  const comps=["Tout",...new Set(matchs.map(m=>COMP[m.competition]||m.competition))];
  if(!comps.includes(filtre))filtre="Tout";
  const liste=matchs.filter(m=>filtre==="Tout"||(COMP[m.competition]||m.competition)===filtre);
  const i=jours.indexOf(jour);
  app.innerHTML=`<div><h1>Nostradamus</h1><div class="sub">Variations de cotes Pinnacle · lecture seule</div></div>
${bandeau()}
<div class="days"><button id="prev" aria-label="Jour précédent" ${i<=0?"disabled style='opacity:.35'":""}>‹</button><span>${jour?libJour(jour):"Aucun match"}</span><button id="next" aria-label="Jour suivant" ${i>=jours.length-1?"disabled style='opacity:.35'":""}>›</button></div>
${comps.length>2?`<div class="row">${comps.map(c=>`<button class="chip ${c===filtre?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>`:""}
${liste.length?liste.map(m=>carte(m).replace('<div class="card">','<div class="card clic" data-id="'+esc(m.id)+'">')).join(""):`<div class="msg">${nbFinis?"Tous les matchs de ce jour sont terminés : ils sont archivés pour les statistiques.":"Pas encore de match enregistré pour ce jour. Le collecteur prépare les 60 prochaines heures."}</div>`}`;
  $("#prev").onclick=()=>aller(i-1);$("#next").onclick=()=>aller(i+1);
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{filtre=b.dataset.c;dessiner()});
  app.querySelectorAll(".card.clic").forEach(c=>c.onclick=()=>{scrollListe=window.scrollY;location.hash="#m/"+c.dataset.id});
  if(scrollListe){const y=scrollListe;scrollListe=0;requestAnimationFrame(()=>window.scrollTo(0,y))}
}
async function aller(i){if(i<0||i>=jours.length)return;jour=jours[i];await charger()}
async function charger(){
  try{const j=await get("data/matchs/"+jour+".json");const tous=Array.isArray(j)?j:(j.matchs||[]);nbFinis=tous.filter(m=>statut(m)==="Terminé").length;matchs=tous.filter(m=>statut(m)!=="Terminé").map(m=>({...m,domicile:fn(m.domicile),exterieur:fn(m.exterieur)}))}
  catch(e){matchs=[];nbFinis=0}
  dessiner();
}
async function init(){
  chargerSante();
  try{
    const idx=await get("data/index.json");jours=Object.keys(idx.jours||{}).sort();
    const auj=jourParis(Date.now());
    jour=jours.includes(auj)?auj:(jours.find(j=>j>auj)||jours[jours.length-1]||null);
    if(jour)await charger();else dessiner();
  }catch(e){app.innerHTML=`<div><h1>Nostradamus</h1></div><div class="msg">Aucun relevé n'est encore enregistré. Le collecteur remplit la base automatiquement : reviens dans quelques heures.</div>`}
}
for(const [id,o] of [["t-matchs","matchs"],["t-stats","stats"],["t-alertes","alertes"]])$("#"+id).onclick=()=>{onglet=o;if(location.hash)history.replaceState(null,"",location.pathname+location.search);document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.id==="t-"+o));dessiner()};
window.addEventListener("hashchange",dessiner);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
init();
setInterval(()=>{if(onglet==="matchs"&&jour)charger();else if(onglet==="alertes")chargerSante(true)},120000);
</script>
